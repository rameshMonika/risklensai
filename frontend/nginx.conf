server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router-dom's BrowserRouter uses client-side history
    # routing, so any path that isn't a real static file (e.g. /dashboard on
    # a hard refresh) must still resolve to index.html and let React Router
    # take over -- otherwise nginx 404s on every route but "/".
    location / {
        try_files $uri /index.html;
    }
}
