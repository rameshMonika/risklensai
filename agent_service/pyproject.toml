[project]
name = "agent-service"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "rameshMonika", email = "87105893+rameshMonika@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "mcp>=1.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "tavily-python>=0.5.0",
    "truststore>=0.9.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "semantic-router>=0.1.0",
    "langchain-openai>=1.6.0",
    "langsmith>=0.1.100",
]

[project.scripts]
agent-service = "agent_service:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
native-tls = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
